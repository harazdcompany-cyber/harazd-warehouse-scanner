<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HARAZD Scanner">
  <title>HARAZD WAREHOUSE</title>

  <link rel="manifest" href="./manifest.json">

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    :root {
      --bg:#f4f5f7;
      --card:#ffffff;
      --black:#111111;
      --muted:#737373;
      --line:#e8e8e8;
      --green:#16803a;
      --red:#c62828;
      --blue:#0b84ff;
      --radius:18px;
    }

    * { box-sizing:border-box; }

    html,body {
      margin:0;
      padding:0;
      min-height:100%;
      background:var(--bg);
      font-family:Arial,Helvetica,sans-serif;
      color:var(--black);
    }

    body {
      padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    .app {
      width:100%;
      max-width:620px;
      margin:0 auto;
      padding:22px 15px 50px;
    }

    .brand {
      font-size:12px;
      font-weight:800;
      letter-spacing:1.6px;
      color:#666;
      margin-bottom:5px;
    }

    h1 {
      margin:0 0 20px;
      font-size:28px;
      line-height:1.15;
    }

    .nav {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:7px;
      margin-bottom:15px;
    }

    .nav-button {
      border:0;
      min-height:58px;
      padding:7px 4px;
      border-radius:12px;
      background:#e8e8e8;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }

    .nav-button.active {
      background:var(--black);
      color:#fff;
    }

    .nav-icon {
      display:block;
      margin-bottom:3px;
      font-size:20px;
    }

    .panel {
      background:var(--card);
      padding:16px;
      border-radius:var(--radius);
      box-shadow:0 4px 22px rgba(0,0,0,.08);
      margin-bottom:16px;
    }

    .code-input {
      width:100%;
      height:58px;
      padding:0 14px;
      border:2px solid #ddd;
      border-radius:12px;
      font-size:18px;
      outline:none;
      background:#fff;
    }

    .code-input:focus {
      border-color:var(--black);
    }

    .button {
      width:100%;
      min-height:54px;
      margin-top:11px;
      border:0;
      border-radius:12px;
      padding:10px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }

    .button:disabled {
      opacity:.6;
      cursor:default;
    }

    .button-black {
      background:var(--black);
      color:#fff;
    }

    .button-gray {
      background:#e9e9e9;
      color:var(--black);
    }

    .button-red {
      display:none;
      background:#e9e9e9;
      color:var(--red);
    }

    #cameraContainer {
      display:none;
      margin-top:14px;
      overflow:hidden;
      border-radius:14px;
      background:#000;
    }

    #reader {
      width:100%;
    }

    #reader video {
      width:100% !important;
      border-radius:14px;
    }

    .status {
      min-height:20px;
      margin-top:13px;
      font-size:14px;
      line-height:1.4;
    }

    .status.success {
      color:var(--green);
      font-weight:700;
    }

    .status.error {
      color:var(--red);
      font-weight:700;
    }

    .status.info {
      color:#555;
      font-weight:700;
    }

    #equipmentCard {
      display:none;
    }

    .equipment-id {
      color:#777;
      font-size:13px;
      font-weight:700;
      margin-bottom:4px;
    }

    .equipment-name {
      font-size:26px;
      font-weight:800;
      margin-bottom:4px;
    }

    .equipment-model {
      font-size:17px;
      color:#666;
      margin-bottom:18px;
    }

    .info-row {
      display:grid;
      grid-template-columns:42% 58%;
      gap:8px;
      padding:11px 0;
      border-bottom:1px solid var(--line);
    }

    .info-label {
      color:#777;
      font-size:13px;
    }

    .info-value {
      font-size:14px;
      font-weight:700;
      text-align:right;
      word-break:break-word;
    }

    .availability {
      padding:15px;
      margin-top:17px;
      border-radius:12px;
      background:#f0f0f0;
      font-size:18px;
      font-weight:800;
      text-align:center;
    }

    .coming {
      display:none;
      padding:30px 15px;
      text-align:center;
      color:#777;
    }

    @media(max-width:420px) {
      .app {
        padding-left:12px;
        padding-right:12px;
      }

      h1 {
        font-size:25px;
      }
    }
  </style>
</head>

<body>
<div class="app">

  <div class="brand">HARAZD WAREHOUSE</div>
  <h1 id="pageTitle">Сканер обладнання</h1>

  <div class="nav">
    <button class="nav-button active" data-mode="scanner" onclick="setMode('scanner')">
      <span class="nav-icon">📷</span>Сканер
    </button>

    <button class="nav-button" data-mode="checkout" onclick="setMode('checkout')">
      <span class="nav-icon">🚚</span>Видача
    </button>

    <button class="nav-button" data-mode="return" onclick="setMode('return')">
      <span class="nav-icon">↩️</span>Повернення
    </button>

    <button class="nav-button" data-mode="repair" onclick="setMode('repair')">
      <span class="nav-icon">🔧</span>Ремонт
    </button>
  </div>

  <div id="scannerScreen" class="panel">
    <input
      id="codeInput"
      class="code-input"
      type="text"
      placeholder="EQ-ID / Barcode / QR"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
    >

    <button id="searchButton" class="button button-black" onclick="searchEquipment()">
      🔎 ЗНАЙТИ
    </button>

    <button id="cameraButton" class="button button-gray" onclick="startCamera()">
      📷 СКАНУВАТИ КАМЕРОЮ
    </button>

    <button id="stopButton" class="button button-red" onclick="stopCamera()">
      ✕ ЗАКРИТИ КАМЕРУ
    </button>

    <div id="cameraContainer">
      <div id="reader"></div>
    </div>

    <div id="status" class="status"></div>
  </div>

  <div id="comingScreen" class="panel coming">
    <div style="font-size:42px;margin-bottom:12px" id="comingIcon">🚚</div>
    <div style="font-size:20px;font-weight:800;color:#111;margin-bottom:7px" id="comingTitle">
      Видача обладнання
    </div>
    <div>Цей модуль додамо наступним.</div>
  </div>

  <div id="equipmentCard" class="panel">
    <div class="equipment-id" id="equipmentId"></div>
    <div class="equipment-name" id="equipmentName"></div>
    <div class="equipment-model" id="equipmentModel"></div>

    <div class="info-row"><div class="info-label">Категорія</div><div class="info-value" id="category"></div></div>
    <div class="info-row"><div class="info-label">Підкатегорія</div><div class="info-value" id="subcategory"></div></div>
    <div class="info-row"><div class="info-label">Виробник</div><div class="info-value" id="manufacturer"></div></div>
    <div class="info-row"><div class="info-label">Серійний ID</div><div class="info-value" id="serial"></div></div>
    <div class="info-row"><div class="info-label">Barcode</div><div class="info-value" id="barcode"></div></div>
    <div class="info-row"><div class="info-label">Склад</div><div class="info-value" id="warehouse"></div></div>
    <div class="info-row"><div class="info-label">Зона</div><div class="info-value" id="zone"></div></div>
    <div class="info-row"><div class="info-label">Стелаж</div><div class="info-value" id="rack"></div></div>
    <div class="info-row"><div class="info-label">Полиця</div><div class="info-value" id="shelf"></div></div>

    <div id="availability" class="availability"></div>
  </div>

</div>

<script>
const HARAZD_API = 'https://script.google.com/macros/s/AKfycbwQyALIh5Sn4s11Mpot1_Ni4BNGaR0iuEhOlBDpP4JtRpa83qp_phyVeA9pKaVVjcDl/exec';

const input = document.getElementById('codeInput');
const searchButton = document.getElementById('searchButton');
const cameraButton = document.getElementById('cameraButton');
const stopButton = document.getElementById('stopButton');

let html5QrCode = null;
let scannerRunning = false;
let scanLocked = false;
let currentMode = 'scanner';
let apiRequestCounter = 0;

input.addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    searchEquipment();
  }
});

function setMode(mode) {
  currentMode = mode;

  document
    .querySelectorAll('.nav-button')
    .forEach(button => {
      button.classList.toggle(
        'active',
        button.dataset.mode === mode
      );
    });

  const scannerScreen = document.getElementById('scannerScreen');
  const comingScreen = document.getElementById('comingScreen');
  const equipmentCard = document.getElementById('equipmentCard');

  if (mode === 'scanner') {
    document.getElementById('pageTitle').textContent = 'Сканер обладнання';
    scannerScreen.style.display = 'block';
    comingScreen.style.display = 'none';
    return;
  }

  scannerScreen.style.display = 'none';
  equipmentCard.style.display = 'none';
  comingScreen.style.display = 'block';

  const modes = {
    checkout: ['Видача обладнання', '🚚', 'Видача обладнання'],
    return: ['Повернення обладнання', '↩️', 'Повернення обладнання'],
    repair: ['Ремонт', '🔧', 'Ремонт обладнання']
  };

  const cfg = modes[mode];

  document.getElementById('pageTitle').textContent = cfg[0];
  document.getElementById('comingIcon').textContent = cfg[1];
  document.getElementById('comingTitle').textContent = cfg[2];
}

function searchEquipment() {
  const code = input.value.trim();

  if (!code) {
    setStatus('Введіть або відскануйте код', 'error');
    return;
  }

  searchButton.disabled = true;
  setStatus('Пошук...', 'info');

  jsonpRequest(
    {
      action: 'find',
      code: code
    },
    15000
  )
    .then(data => {
      showEquipment(data);
    })
    .catch(error => {
      document.getElementById('equipmentCard').style.display = 'none';

      setStatus(
        'Не вдалося підключитися до HARAZD API. ' +
        (error && error.message ? error.message : ''),
        'error'
      );

      console.error('HARAZD API ERROR:', error);
    })
    .finally(() => {
      searchButton.disabled = false;
    });
}

function jsonpRequest(params, timeoutMs) {
  return new Promise((resolve, reject) => {
    apiRequestCounter += 1;

    const callbackName =
      '__harazd_jsonp_' +
      Date.now() +
      '_' +
      apiRequestCounter;

    const script = document.createElement('script');

    let finished = false;

    const cleanup = () => {
      if (finished) return;
      finished = true;

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      clearTimeout(timer);
    };

    window[callbackName] = data => {
      cleanup();
      resolve(data);
    };

    const query = new URLSearchParams();

    Object.keys(params).forEach(key => {
      if (
        params[key] !== undefined &&
        params[key] !== null
      ) {
        query.set(key, String(params[key]));
      }
    });

    query.set('callback', callbackName);

    // cache-buster: особливо важливо для Safari/iPhone
    query.set('_', String(Date.now()));

    script.async = true;
    script.src = HARAZD_API + '?' + query.toString();

    script.onerror = () => {
      cleanup();
      reject(
        new Error(
          'Сервер Apps Script не повернув JSONP-відповідь'
        )
      );
    };

    const timer = setTimeout(() => {
      cleanup();
      reject(
        new Error(
          'Перевищено час очікування відповіді API'
        )
      );
    }, timeoutMs || 15000);

    document.head.appendChild(script);
  });
}

function showEquipment(data) {
  if (!data || !data.success) {
    document.getElementById('equipmentCard').style.display = 'none';

    setStatus(
      data && data.message
        ? data.message
        : 'Обладнання не знайдено',
      'error'
    );

    return;
  }

  setStatus('✅ Обладнання знайдено', 'success');

  setText('equipmentId', data.id);
  setText('equipmentName', data.name);
  setText('equipmentModel', data.model);
  setText('category', data.category);
  setText('subcategory', data.subcategory);
  setText('manufacturer', data.manufacturer);
  setText('serial', data.serial);
  setText('barcode', data.barcode);
  setText('warehouse', data.warehouse);
  setText('zone', data.zone);
  setText('rack', data.rack);
  setText('shelf', data.shelf);
  setText(
    'availability',
    'Доступно: ' +
    String(data.available ?? 0) +
    ' / ' +
    String(data.total ?? 0)
  );

  document.getElementById('equipmentCard').style.display = 'block';

  input.value = '';
}

async function startCamera() {
  if (scannerRunning) return;

  if (typeof Html5Qrcode === 'undefined') {
    setStatus('Модуль сканування не завантажився', 'error');
    return;
  }

  cameraButton.disabled = true;
  setStatus('Запуск камери...', 'info');

  try {
    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error('Камеру не знайдено');
    }

    let selectedCamera = cameras[0];

    const backCamera = cameras.find(camera => {
      const label = String(camera.label || '').toLowerCase();

      return (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment') ||
        label.includes('зад')
      );
    });

    if (backCamera) {
      selectedCamera = backCamera;
    }

    document.getElementById('cameraContainer').style.display = 'block';
    cameraButton.style.display = 'none';
    stopButton.style.display = 'block';

    html5QrCode = new Html5Qrcode('reader');

    await html5QrCode.start(
      selectedCamera.id,
      {
        fps: 12,
        qrbox: (width, height) => ({
          width: Math.floor(width * 0.82),
          height: Math.floor(
            Math.min(
              height * 0.46,
              230
            )
          )
        })
      },
      onScanSuccess,
      () => {}
    );

    scannerRunning = true;

    setStatus(
      '📷 Наведи камеру на QR або штрихкод',
      'success'
    );

  } catch (error) {
    scannerRunning = false;

    if (html5QrCode) {
      try {
        await html5QrCode.clear();
      } catch (e) {}
    }

    html5QrCode = null;

    document.getElementById('cameraContainer').style.display = 'none';
    cameraButton.style.display = 'block';
    stopButton.style.display = 'none';

    setStatus(
      'Помилка камери: ' +
      (error && error.message ? error.message : String(error)),
      'error'
    );

    console.error('CAMERA ERROR:', error);
  } finally {
    cameraButton.disabled = false;
  }
}

async function onScanSuccess(decodedText) {
  if (scanLocked) return;

  scanLocked = true;

  input.value = String(decodedText || '').trim();

  try {
    if (navigator.vibrate) {
      navigator.vibrate(100);
    }
  } catch (e) {}

  await stopCamera();

  searchEquipment();

  setTimeout(() => {
    scanLocked = false;
  }, 800);
}

async function stopCamera() {
  if (html5QrCode && scannerRunning) {
    try {
      await html5QrCode.stop();
    } catch (e) {}
  }

  if (html5QrCode) {
    try {
      await html5QrCode.clear();
    } catch (e) {}
  }

  html5QrCode = null;
  scannerRunning = false;

  document.getElementById('cameraContainer').style.display = 'none';
  cameraButton.style.display = 'block';
  stopButton.style.display = 'none';
}

function setStatus(text, type) {
  const status = document.getElementById('status');

  status.textContent = text;
  status.className = 'status';

  if (type) {
    status.classList.add(type);
  }
}

function setText(id, value) {
  const element = document.getElementById(id);

  if (!element) return;

  element.textContent =
    value === null || value === undefined
      ? ''
      : String(value);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker
      .register('./sw.js')
      .catch(error => {
        console.warn('SW registration failed:', error);
      });
  });
}
</script>
</body>
</html>
