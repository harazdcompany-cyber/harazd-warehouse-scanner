<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7">
  <title>HARAZD WAREHOUSE</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">HARAZD</div>
    <h1>WAREHOUSE</h1>
    <p>Warehouse Management System</p>
  </header>

  <section id="home" class="page active">
    <div class="grid">
      <button class="card" onclick="showPage('scanner')"><span>📷</span><b>СКАНЕР</b><small>Пошук обладнання</small></button>
      <button class="card" onclick="openAddEquipment()"><span>＋</span><b>ДОДАТИ</b><small>Нове обладнання</small></button>
      <button class="card disabled"><span>🚚</span><b>ВИДАЧА</b><small>Обладнання зі складу</small></button>
      <button class="card disabled"><span>↩️</span><b>ПОВЕРНЕННЯ</b><small>Повернення на склад</small></button>
      <button class="card disabled"><span>📦</span><b>ОБЛАДНАННЯ</b><small>Каталог і залишки</small></button>
      <button class="card disabled"><span>🔧</span><b>РЕМОНТ</b><small>Облік ремонту</small></button>
      <button class="card disabled"><span>📋</span><b>ЗАВАНТАЖЕННЯ</b><small>Комплектація</small></button>
      <button class="card disabled"><span>⚙️</span><b>КЕРУВАННЯ</b><small>Налаштування</small></button>
    </div>
  </section>

  <section id="scanner" class="page">
    <button class="back" onclick="stopScanner();showPage('home')">← Назад</button>
    <h2>QR СКАНЕР</h2>
    <p>Наведіть камеру на QR-код обладнання.</p>
    <div id="reader"></div>
    <div class="actions">
      <button class="primary" onclick="startScanner()">Увімкнути камеру</button>
      <button onclick="stopScanner()">Зупинити</button>
    </div>
    <div id="scanResult" class="result"></div>
  </section>

  <div id="message" class="message"></div>
</main>
<script src="app.js"></script>
</body>
</html>
