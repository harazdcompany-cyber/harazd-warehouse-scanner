<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HARAZD Scanner">
  <title>HARAZD WAREHOUSE</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root{--bg:#f4f5f7;--card:#fff;--black:#111;--line:#e8e8e8;--green:#16803a;--red:#c62828;--radius:18px}
    *{box-sizing:border-box} html,body{margin:0;padding:0;min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--black)}
    body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    .app{width:100%;max-width:620px;margin:0 auto;padding:22px 15px 50px}
    .brand{font-size:12px;font-weight:800;letter-spacing:1.6px;color:#666;margin-bottom:5px}
    h1{margin:0 0 20px;font-size:28px;line-height:1.15}
    .nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:15px}
    .nav-button{border:0;min-height:58px;padding:7px 4px;border-radius:12px;background:#e8e8e8;font-size:12px;font-weight:700;cursor:pointer}
    .nav-button.active{background:var(--black);color:#fff}.nav-icon{display:block;margin-bottom:3px;font-size:20px}
    .panel{background:var(--card);padding:16px;border-radius:var(--radius);box-shadow:0 4px 22px rgba(0,0,0,.08);margin-bottom:16px}
    .code-input{width:100%;height:58px;padding:0 14px;border:2px solid #ddd;border-radius:12px;font-size:18px;outline:none;background:#fff}
    .code-input:focus{border-color:var(--black)}
    .button{width:100%;min-height:54px;margin-top:11px;border:0;border-radius:12px;padding:10px;font-size:16px;font-weight:800;cursor:pointer}
    .button-black{background:var(--black);color:#fff}.button-gray{background:#e9e9e9;color:var(--black)}.button-red{display:none;background:#e9e9e9;color:var(--red)}
    #cameraContainer{display:none;margin-top:14px;overflow:hidden;border-radius:14px;background:#000}#reader{width:100%}#reader video{width:100%!important;border-radius:14px}
    .status{min-height:20px;margin-top:13px;font-size:14px;line-height:1.4}.status.success{color:var(--green);font-weight:700}.status.error{color:var(--red);font-weight:700}
    #equipmentCard{display:none}.equipment-id{color:#777;font-size:13px;font-weight:700;margin-bottom:4px}.equipment-name{font-size:26px;font-weight:800;margin-bottom:4px}.equipment-model{font-size:17px;color:#666;margin-bottom:18px}
    .info-row{display:grid;grid-template-columns:42% 58%;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.info-label{color:#777;font-size:13px}.info-value{font-size:14px;font-weight:700;text-align:right;word-break:break-word}
    .availability{padding:15px;margin-top:17px;border-radius:12px;background:#f0f0f0;font-size:18px;font-weight:800;text-align:center}
    .coming{display:none;padding:30px 15px;text-align:center;color:#777}
    @media(max-width:420px){.app{padding-left:12px;padding-right:12px}h1{font-size:25px}}
  </style>
</head>
<body>
<div class="app">
  <div class="brand">HARAZD WAREHOUSE</div>
  <h1 id="pageTitle">Сканер обладнання</h1>

  <div class="nav">
    <button class="nav-button active" data-mode="scanner" onclick="setMode('scanner')"><span class="nav-icon">📷</span>Сканер</button>
    <button class="nav-button" data-mode="checkout" onclick="setMode('checkout')"><span class="nav-icon">🚚</span>Видача</button>
    <button class="nav-button" data-mode="return" onclick="setMode('return')"><span class="nav-icon">↩️</span>Повернення</button>
    <button class="nav-button" data-mode="repair" onclick="setMode('repair')"><span class="nav-icon">🔧</span>Ремонт</button>
  </div>

  <div id="scannerScreen" class="panel">
    <input id="codeInput" class="code-input" type="text" placeholder="EQ-ID / Barcode / QR" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button class="button button-black" onclick="searchEquipment()">🔎 ЗНАЙТИ</button>
    <button id="cameraButton" class="button button-gray" onclick="startCamera()">📷 СКАНУВАТИ КАМЕРОЮ</button>
    <button id="stopButton" class="button button-red" onclick="stopCamera()">✕ ЗАКРИТИ КАМЕРУ</button>
    <div id="cameraContainer"><div id="reader"></div></div>
    <div id="status" class="status"></div>
  </div>

  <div id="comingScreen" class="panel coming">
    <div style="font-size:42px;margin-bottom:12px" id="comingIcon">🚚</div>
    <div style="font-size:20px;font-weight:800;color:#111;margin-bottom:7px" id="comingTitle">Видача обладнання</div>
    <div>Цей модуль додамо наступним.</div>
  </div>

  <div id="equipmentCard" class="panel">
    <div class="equipment-id" id="equipmentId"></div>
    <div class="equipment-name" id="equipmentName"></div>
    <div class="equipment-model" id="equipmentModel"></div>
    <div class="info-row"><div class="info-label">Категорія</div><div class="info-value" id="category"></div></div>
    <div class="info-row"><div class="info-label">Підкатегорія</div><div class="info-value" id="subcategory"></div></div>
    <div class="info-row"><div class="info-label">Виробник</div><div class="info-value" id="manufacturer"></div></div>
    <div class="info-row"><div class="info-label">Серійний ID</div><div class="info-value" id="serial"></div></div>
    <div class="info-row"><div class="info-label">Barcode</div><div class="info-value" id="barcode"></div></div>
    <div class="info-row"><div class="info-label">Склад</div><div class="info-value" id="warehouse"></div></div>
    <div class="info-row"><div class="info-label">Зона</div><div class="info-value" id="zone"></div></div>
    <div class="info-row"><div class="info-label">Стелаж</div><div class="info-value" id="rack"></div></div>
    <div class="info-row"><div class="info-label">Полиця</div><div class="info-value" id="shelf"></div></div>
    <div id="availability" class="availability"></div>
  </div>
</div>

<script>
const HARAZD_API='https://script.google.com/macros/s/AKfycbwQyALIh5Sn4s11Mpot1_Ni4BNGaR0iuEhOlBDpP4JtRpa83qp_phyVeA9pKaVVjcDl/exec';
const input=document.getElementById('codeInput');
let html5QrCode=null,scannerRunning=false,scanLocked=false,currentMode='scanner';

input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchEquipment();}});

function setMode(mode){
  currentMode=mode;
  document.querySelectorAll('.nav-button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  const s=document.getElementById('scannerScreen'), c=document.getElementById('comingScreen'), e=document.getElementById('equipmentCard');
  if(mode==='scanner'){
    document.getElementById('pageTitle').textContent='Сканер обладнання';
    s.style.display='block'; c.style.display='none'; return;
  }
  s.style.display='none'; e.style.display='none'; c.style.display='block';
  const cfg={
    checkout:['Видача обладнання','🚚','Видача обладнання'],
    return:['Повернення обладнання','↩️','Повернення обладнання'],
    repair:['Ремонт','🔧','Ремонт обладнання']
  }[mode];
  document.getElementById('pageTitle').textContent=cfg[0];
  document.getElementById('comingIcon').textContent=cfg[1];
  document.getElementById('comingTitle').textContent=cfg[2];
}

function searchEquipment(){
  const code=input.value.trim();
  if(!code){setStatus('Введіть або відскануйте код','error');return;}
  setStatus('Пошук...','');
  jsonpRequest({action:'find',code},showEquipment);
}

function jsonpRequest(params,callback){
  const callbackName='harazd_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  let script=null;
  window[callbackName]=data=>{
    try{callback(data);}
    finally{
      delete window[callbackName];
      if(script&&script.parentNode)script.parentNode.removeChild(script);
    }
  };
  const query=new URLSearchParams({...params,callback:callbackName});
  script=document.createElement('script');
  script.src=HARAZD_API+'?'+query.toString();
  script.onerror=()=>{delete window[callbackName];script.remove();setStatus('Не вдалося підключитися до HARAZD API','error');};
  document.body.appendChild(script);
}

function showEquipment(data){
  if(!data||!data.success){
    document.getElementById('equipmentCard').style.display='none';
    setStatus(data&&data.message?data.message:'Обладнання не знайдено','error');
    return;
  }
  setStatus('✅ Обладнання знайдено','success');
  setText('equipmentId',data.id);setText('equipmentName',data.name);setText('equipmentModel',data.model);
  setText('category',data.category);setText('subcategory',data.subcategory);setText('manufacturer',data.manufacturer);
  setText('serial',data.serial);setText('barcode',data.barcode);setText('warehouse',data.warehouse);
  setText('zone',data.zone);setText('rack',data.rack);setText('shelf',data.shelf);
  setText('availability','Доступно: '+data.available+' / '+data.total);
  document.getElementById('equipmentCard').style.display='block';
  input.value='';
}

async function startCamera(){
  if(scannerRunning)return;
  if(typeof Html5Qrcode==='undefined'){setStatus('Модуль сканування не завантажився','error');return;}
  setStatus('Запуск камери...','');
  try{
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras||cameras.length===0)throw new Error('Камеру не знайдено');
    let selectedCamera=cameras[0];
    const backCamera=cameras.find(camera=>{
      const label=String(camera.label||'').toLowerCase();
      return label.includes('back')||label.includes('rear')||label.includes('environment')||label.includes('зад');
    });
    if(backCamera)selectedCamera=backCamera;
    document.getElementById('cameraContainer').style.display='block';
    document.getElementById('cameraButton').style.display='none';
    document.getElementById('stopButton').style.display='block';
    html5QrCode=new Html5Qrcode('reader');
    await html5QrCode.start(
      selectedCamera.id,
      {fps:12,qrbox:(width,height)=>({width:Math.floor(width*.82),height:Math.floor(Math.min(height*.46,230))})},
      onScanSuccess,
      ()=>{}
    );
    scannerRunning=true;
    setStatus('📷 Наведи камеру на QR або штрихкод','success');
  }catch(error){
    scannerRunning=false;html5QrCode=null;
    document.getElementById('cameraContainer').style.display='none';
    document.getElementById('cameraButton').style.display='block';
    document.getElementById('stopButton').style.display='none';
    setStatus('Помилка камери: '+(error.message||String(error)),'error');
  }
}

async function onScanSuccess(decodedText){
  if(scanLocked)return;
  scanLocked=true;
  input.value=decodedText;
  try{if(navigator.vibrate)navigator.vibrate(100);}catch(e){}
  await stopCamera();
  searchEquipment();
  setTimeout(()=>{scanLocked=false;},800);
}

async function stopCamera(){
  if(html5QrCode&&scannerRunning){try{await html5QrCode.stop();}catch(e){}}
  if(html5QrCode){try{await html5QrCode.clear();}catch(e){}}
  html5QrCode=null;scannerRunning=false;
  document.getElementById('cameraContainer').style.display='none';
  document.getElementById('cameraButton').style.display='block';
  document.getElementById('stopButton').style.display='none';
}

function setStatus(text,type){
  const s=document.getElementById('status');
  s.textContent=text;s.className='status';
  if(type)s.classList.add(type);
}

function setText(id,value){
  const el=document.getElementById(id);
  if(el)el.textContent=(value===null||value===undefined)?'':value;
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
