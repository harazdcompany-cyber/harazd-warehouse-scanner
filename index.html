<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>HARAZD WAREHOUSE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">HARAZD</div>
    <h1>WAREHOUSE</h1>
    <div class="subtitle">Warehouse Management System</div>
  </header>
  <main class="dashboard">
    <button class="widget" onclick="openScanner()"><div class="icon">📷</div><div class="widget-title">СКАНЕР</div><div class="widget-text">Пошук обладнання</div></button>
    <button class="widget" onclick="openAddEquipment()"><div class="icon">➕</div><div class="widget-title">ДОДАТИ</div><div class="widget-text">Нове обладнання</div></button>
    <button class="widget disabled" onclick="notReady('Видача')"><div class="icon">🚚</div><div class="widget-title">ВИДАЧА</div><div class="widget-text">Обладнання зі складу</div></button>
    <button class="widget disabled" onclick="notReady('Повернення')"><div class="icon">↩️</div><div class="widget-title">ПОВЕРНЕННЯ</div><div class="widget-text">Повернення на склад</div></button>
    <button class="widget disabled" onclick="notReady('Обладнання')"><div class="icon">📦</div><div class="widget-title">ОБЛАДНАННЯ</div><div class="widget-text">Каталог і залишки</div></button>
    <button class="widget disabled" onclick="notReady('Ремонт')"><div class="icon">🔧</div><div class="widget-title">РЕМОНТ</div><div class="widget-text">Облік ремонту</div></button>
    <button class="widget disabled" onclick="notReady('Завантаження')"><div class="icon">📋</div><div class="widget-title">ЗАВАНТАЖЕННЯ</div><div class="widget-text">Комплектація подій</div></button>
    <button class="widget disabled" onclick="notReady('Керування')"><div class="icon">⚙️</div><div class="widget-title">КЕРУВАННЯ</div><div class="widget-text">Налаштування</div></button>
  </main>
  <div class="message" id="message"></div>
</div>
<script src="app.js"></script>
</body>
</html>
